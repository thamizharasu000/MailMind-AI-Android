name: mailmind_ai
description: MailMind AI - smart email assistant for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  app_links: ^6.4.0
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/mailmind_logo.png
    - assets/brand/splash.png
    - assets/features/summary.png
    - assets/features/tasks.png
    - assets/features/reply.png
    - assets/features/security.png
    - assets/features/avatar.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: '#3D2C99'
  adaptive_icon_foreground: assets/brand/app_icon.png
